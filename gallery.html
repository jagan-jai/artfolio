    <style>
        :root {
            --gold: #c9a96e;
            --gold-light: #e0c88a;
            --gold-dark: #8a6e3a;
            --bg: #0d0d0d;
            --bg-elevated: #141414;
            --bg-card: #1a1a1a;
            --text: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border: rgba(201, 169, 110, 0.15);
            --border-strong: rgba(201, 169, 110, 0.3);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 8px;
            --radius-lg: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        a { color: var(--gold); text-decoration: none; transition: color var(--transition); }
        a:hover { color: var(--gold-light); }
        img { display: block; max-width: 100%; }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Nav */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100; height: 72px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px;
            background: rgba(13, 13, 13, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 12px;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem; font-weight: 600; color: var(--text);
        }
        .nav-brand-mark {
            width: 36px; height: 36px; border-radius: 6px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex; align-items: center; justify-content: center;
            color: var(--bg); font-weight: 800; font-size: 1.1rem;
        }
        .nav-links { display: flex; align-items: center; gap: 40px; }
        .nav-link {
            font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-secondary);
            padding: 8px 0; border-bottom: 1px solid transparent;
            transition: all var(--transition);
        }
        .nav-link:hover { color: var(--text); border-bottom-color: var(--gold); }
        .nav-link.active { color: var(--text); border-bottom-color: var(--gold); }

        /* Hero */
        .page-hero {
            padding: 120px 32px 60px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .page-hero h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin-bottom: 12px;
            color: var(--text);
        }
        .page-hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Filter Bar */
        .filter-section {
            padding: 2rem 0;
            position: sticky;
            top: 72px;
            z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: 9999px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .filter-btn:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }
        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--bg);
            font-weight: 600;
        }

        /* Gallery Grid */
        .gallery-section { padding: 4rem 0; }
        .medium-section { margin-bottom: 4rem; }
        .medium-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .medium-title {
            font-size: 1.5rem;
            color: var(--text);
            font-weight: 400;
        }
        .medium-count {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
        }
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-strong);
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            transition: transform 0.5s var(--transition);
        }
        .gallery-item:hover img { transform: scale(1.04); }
        .gallery-item-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            opacity: 0;
            transform: translateY(8px);
            transition: all var(--transition);
        }
        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        .gallery-item-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .gallery-item-meta {
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            padding: 48px 0;
            border-top: 1px solid var(--border);
            background: var(--bg-elevated);
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 24px;
        }
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 600;
        }
        .footer-links { display: flex; gap: 32px; }
        .footer-links a {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .footer-copy {
            font-size: 0.65rem;
            color: var(--text-faint);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }
        }
        @media (max-width: 600px) {
            .nav { padding: 0 16px; height: 60px; }
            .page-hero { padding: 100px 16px 40px; }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .filter-btn {
                padding: 6px 14px;
                font-size: 0.7rem;
            }
        }
    </style>

        const filterBar = document.getElementById('filter-bar');

        // Build filter buttons
        Object.keys(ARTWORKS_DATA).forEach(medium => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.filter = medium;
            btn.textContent = `${medium} (${ARTWORKS_DATA[medium].length})`;
            filterBar.appendChild(btn);
        });

        function renderGallery(filter) {
            galleryContent.innerHTML = '';
            
            const mediums = filter === 'all' ? Object.keys(ARTWORKS_DATA) : [filter];
            
            mediums.forEach(medium => {
                const items = ARTWORKS_DATA[medium];
                
                const section = document.createElement('div');
                section.className = 'medium-section';
                section.innerHTML = `
                    <div class="medium-header">
                        <h3 class="medium-title">${medium}</h3>
                        <span class="medium-count">${items.length} artwork${items.length !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="gallery-grid">
                        ${items.map(item => `
                            <article class="gallery-item">
                                <img class="gallery-item-image" src="artworks/${item.file}" alt="${item.caption}" loading="lazy">
                                <div class="gallery-item-overlay">
                                    <div class="gallery-item-title">${item.caption}</div>
                                    <div class="gallery-item-meta">${medium}</div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
                galleryContent.appendChild(section);
            });
        }

        // Initial render
        renderGallery('all');

        // Filter click handlers
        filterBar.addEventListener('click', (e) => {
            if (!e.target.classList.contains('filter-btn')) return;
            
            filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            renderGallery(e.target.dataset.filter);
        });
    </script>
