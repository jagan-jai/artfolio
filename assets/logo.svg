<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .script { font-family: 'Brush Script MT', 'Segoe Script', cursive; font-size: 52px; fill: #2a1a0a; }
      .serif { font-family: 'Times New Roman', Georgia, serif; font-size: 28px; fill: #2a1a0a; letter-spacing: 2px; }
      .border { fill: none; stroke: #2a1a0a; stroke-width: 3; }
      .gold { stroke: #d4b87a; stroke-width: 2; fill: none; }
      .gold-fill { fill: #d4b87a; }
    </style>
  </defs>

  <!-- Outer border rings -->
  <circle cx="200" cy="200" r="185" class="border"/>
  <circle cx="200" cy="200" r="170" class="gold"/>
  <circle cx="200" cy="200" r="160" class="border"/>

  <!-- Small decorative dots around the border -->
  <circle cx="200" cy="35" r="4" class="gold-fill"/>
  <circle cx="200" cy="365" r="4" class="gold-fill"/>
  <circle cx="35" cy="200" r="4" class="gold-fill"/>
  <circle cx="365" cy="200" r="4" class="gold-fill"/>
  <circle cx="80" cy="80" r="3" class="gold-fill"/>
  <circle cx="320" cy="80" r="3" class="gold-fill"/>
  <circle cx="80" cy="320" r="3" class="gold-fill"/>
  <circle cx="320" cy="320" r="3" class="gold-fill"/>

  <!-- Art tools crossed in center -->
  <g transform="translate(200, 195) rotate(-30)">
    <!-- Paintbrush -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#d4b87a" stroke-width="4" stroke-linecap="round"/>
    <rect x="-45" y="-4" width="15" height="8" rx="2" fill="#d4b87a"/>
    <!-- Palette knife -->
    <line x1="-35" y1="15" x2="35" y2="-15" stroke="#d4b87a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="38" cy="-18" rx="6" ry="4" fill="#d4b87a"/>
    <!-- Pencil -->
    <line x1="-30" y1="-15" x2="30" y2="15" stroke="#d4b87a" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,15 35,12 30,10" fill="#d4b87a"/>
  </g>

  <!-- Artist palette behind tools -->
  <ellipse cx="200" cy="200" rx="55" ry="40" fill="none" stroke="#d4b87a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Paint dabs on palette -->
  <circle cx="175" cy="185" r="4" fill="#d4b87a" opacity="0.6"/>
  <circle cx="195" cy="175" r="3" fill="#d4b87a" opacity="0.6"/>
  <circle cx="215" cy="180" r="4" fill="#d4b87a" opacity="0.6"/>
  <circle cx="225" cy="195" r="3" fill="#d4b87a" opacity="0.6"/>

  <!-- Main text -->
  <text x="200" y="105" text-anchor="middle" class="script">Jagan's</text>
  <text x="200" y="285" text-anchor="middle" class="serif">ARTFOLIO</text>

  <!-- Decorative flourishes -->
  <path d="M 120 130 Q 140 125 160 130" stroke="#d4b87a" stroke-width="1.5" fill="none"/>
  <path d="M 240 130 Q 260 125 280 130" stroke="#d4b87a" stroke-width="1.5" fill="none"/>
  <path d="M 120 270 Q 140 275 160 270" stroke="#d4b87a" stroke-width="1.5" fill="none"/>
  <path d="M 240 270 Q 260 275 280 270" stroke="#d4b87a" stroke-width="1.5" fill="none"/>

  <!-- Small art tool icons in border -->
  <g transform="translate(200, 35)">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#d4b87a"/>
  </g>
  <g transform="translate(200, 365)">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#d4b87a"/>
  </g>
  <g transform="translate(35, 200)">
    <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#d4b87a"/>
  </g>
  <g transform="translate(365, 200)">
    <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#d4b87a"/>
  </g>
</svg>
